<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>２０２６あゆ祭り</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: sans-serif;
    background: #dfe8f1;
    padding-bottom: 120px;
}

.container {
    padding: 10px;
}

.top-area {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
}

.reset-btn {
    font-size: 20px;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
}

td {
    border: 1px solid #666;
    padding: 8px 4px;
    font-size: 20px;
    text-align: center;
}

td.name {
    text-align: left;
    width: 45%;
}

td.price {
    width: 20%;
}

td.qty {
    width: 35%;
}

.qty-area {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.qty-btn {
    width: 42px;
    height: 42px;
    font-size: 26px;
    border-radius: 6px;
    cursor: pointer;
}

.count {
    min-width: 30px;
    font-size: 22px;
}

.footer {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background: white;
    border-top: 2px solid #bbb;
    padding: 10px;
    z-index: 9999;
}

.footer-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr;
    gap: 10px;
    align-items: end;
}

.label {
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 5px;
}

.money-input {
    width: 100%;
    height: 40px;
    font-size: 26px;
    text-align: right;
}

.clear-btn {
    width: 100%;
    height: 40px;
    font-size: 22px;
    margin-top: 5px;
    cursor: pointer;
}

.total-value,
.change-value {
    font-size: 40px;
    text-align: center;
}

@media (max-width: 480px) {
    td {
        font-size: 18px;
    }

    .total-value,
    .change-value {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top-area">
        <button class="reset-btn" onclick="resetAll()">最初から</button>
    </div>

    <table id="menuTable"></table>

</div>

<div class="footer">
    <div class="footer-grid">

        <div>
            <div class="label">預かり金</div>
            <input type="number" id="received" class="money-input" oninput="calcChange()">
            <button class="clear-btn" onclick="clearReceived()">クリア</button>
        </div>

        <div>
            <div class="label">合計</div>
            <div id="total" class="total-value">0</div>
        </div>

        <div>
            <div class="label">お釣り</div>
            <div id="change" class="change-value">0</div>
        </div>

    </div>
</div>

<script>

const items = [
    {name:"焼きそば", price:700},
    {name:"チャーハン", price:500},
    {name:"カリーブルスト", price:500},
    {name:"冷やしキュウリ", price:500},
    {name:"ラムネ", price:250},
    {name:"ビール", price:600},
    {name:"水", price:100},
    {name:"チューハイ", price:200},
    {name:"ハイボール", price:300},
    {name:"ポテト", price:400},
    {name:"唐揚げ", price:500},
    {name:"たこ焼き", price:600}
];

const counts = new Array(items.length).fill(0);

const table = document.getElementById("menuTable");

items.forEach((item, index) => {

    const row = document.createElement("tr");

    row.innerHTML = `
        <td class="name">${item.name}</td>
        <td class="price">${item.price}</td>
        <td class="qty">
            <div class="qty-area">
                <button class="qty-btn" onclick="changeQty(${index},-1)">−</button>
                <span id="count${index}" class="count">0</span>
                <button class="qty-btn" onclick="changeQty(${index},1)">＋</button>
            </div>
        </td>
    `;

    table.appendChild(row);

});

function changeQty(index, diff){

    counts[index] += diff;

    if(counts[index] < 0){
        counts[index] = 0;
    }

    document.getElementById("count" + index).textContent = counts[index];

    calcTotal();
}

function calcTotal(){

    let total = 0;

    items.forEach((item, index)=>{
        total += item.price * counts[index];
    });

    document.getElementById("total").textContent = total;

    calcChange();
}

function calcChange(){

    const total =
        Number(document.getElementById("total").textContent);

    const received =
        Number(document.getElementById("received").value || 0);

    document.getElementById("change").textContent =
        received - total;
}

function clearReceived(){

    document.getElementById("received").value = "";
    calcChange();
}

function resetAll(){

    for(let i=0;i<counts.length;i++){
        counts[i] = 0;
        document.getElementById("count" + i).textContent = "0";
    }

    document.getElementById("received").value = "";
    document.getElementById("total").textContent = "0";
    document.getElementById("change").textContent = "0";
}

</script>

</body>
</html>
