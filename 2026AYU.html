<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>２０２６あゆ祭り</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#d7e4f0;
    font-family:"Yu Gothic","Meiryo",sans-serif;
    padding-bottom:140px;
}

.container{
    padding:16px;
}

.reset-btn{
    font-size:20px;
    padding:10px 20px;
    border:1px solid #333;
    border-radius:8px;
    background:#f5f5f5;
    margin-bottom:16px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

td{
    border:1px solid #333;
    padding:10px 6px;
    font-size:20px;
}

.name{
    width:42%;
}

.price{
    width:18%;
    text-align:center;
}

.qty-area{
    width:40%;
}

.qty-control{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.qty-btn{
    width:42px;
    height:42px;
    font-size:28px;
    border:1px solid #333;
    border-radius:6px;
    cursor:pointer;
    background:#e5e5e5;
}

.qty{
    width:40px;
    text-align:center;
    font-size:22px;
}

.footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:9999;
    background:white;
    border-top:2px solid #ccc;
    padding:12px;
}

.footer-grid{
    display:grid;
    grid-template-columns:2fr 1.3fr 1fr 1fr;
    gap:8px;
    align-items:end;
}

.label{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:6px;
}

.money-input{
    width:100%;
    height:44px;
    font-size:24px;
    text-align:center;
}

.clear-btn{
    width:100%;
    height:44px;
    font-size:18px;
    font-weight:bold;
    border-radius:6px;
    cursor:pointer;
}

.amount{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
}

@media (max-width:480px){

    td{
        font-size:18px;
    }

    .qty-btn{
        width:40px;
        height:40px;
    }

    .footer-grid{
        grid-template-columns:2fr 1.2fr 1fr 1fr;
    }

    .money-input{
        font-size:20px;
    }

    .amount{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <button class="reset-btn" onclick="resetAll()">最初から</button>

    <table>
        <tbody id="menuTable"></tbody>
    </table>

</div>

<div class="footer">

    <div class="footer-grid">

        <div>
            <div class="label">預かり金</div>
            <input
                type="number"
                id="received"
                class="money-input"
                oninput="updateChange()">
        </div>

        <div>
            <div class="label">&nbsp;</div>
            <button class="clear-btn" onclick="clearReceived()">
                クリア
            </button>
        </div>

        <div>
            <div class="label">合計</div>
            <div id="total" class="amount">0</div>
        </div>

        <div>
            <div class="label">お釣り</div>
            <div id="change" class="amount">0</div>
        </div>

    </div>

</div>

<script>

const items = [
    {name:"焼きそば", price:700},
    {name:"チャーハン", price:500},
    {name:"カリーブルスト", price:500},
    {name:"冷やしキュウリ", price:500},
    {name:"ラムネ", price:250},
    {name:"ビール", price:600}
];

const quantities = Array(items.length).fill(0);

const menuTable = document.getElementById("menuTable");

items.forEach((item,index)=>{

    const row = document.createElement("tr");

    row.innerHTML = `
        <td class="name">${item.name}</td>
        <td class="price">${item.price}</td>
        <td class="qty-area">
            <div class="qty-control">
                <button class="qty-btn"
                    onclick="changeQty(${index},-1)">－</button>

                <span id="qty-${index}" class="qty">0</span>

                <button class="qty-btn"
                    onclick="changeQty(${index},1)">＋</button>
            </div>
        </td>
    `;

    menuTable.appendChild(row);
});

function changeQty(index,diff){

    quantities[index] += diff;

    if(quantities[index] < 0){
        quantities[index] = 0;
    }

    document.getElementById(
        `qty-${index}`
    ).textContent = quantities[index];

    updateTotal();
}

function updateTotal(){

    let total = 0;

    items.forEach((item,index)=>{
        total += item.price * quantities[index];
    });

    document.getElementById("total").textContent = total;

    updateChange();
}

function updateChange(){

    const total =
        Number(document.getElementById("total").textContent);

    const received =
        Number(document.getElementById("received").value || 0);

    document.getElementById("change").textContent =
        received - total;
}

function clearReceived(){

    document.getElementById("received").value = "";
    updateChange();
}

function resetAll(){

    for(let i=0;i<quantities.length;i++){
        quantities[i] = 0;
        document.getElementById(
            `qty-${i}`
        ).textContent = 0;
    }

    document.getElementById("received").value = "";
    document.getElementById("total").textContent = "0";
    document.getElementById("change").textContent = "0";
}

</script>

</body>
</html>
