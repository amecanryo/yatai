<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026あゆ祭</title>

<style>
body {
    font-family: sans-serif;
    margin: 15px;
    max-width: 500px;
}

h1 {
    font-size: 2rem;
    margin-bottom: 20px;
}

.product {
    margin-bottom: 20px;
}

.product-name {
    font-size: 1.8rem;
}

.price {
    font-size: 1.8rem;
    margin-top: 5px;
}

.control {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
    margin-top: -60px;
}

.btn {
    width: 50px;
    height: 50px;
    font-size: 2rem;
    border: 2px solid #000;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
}

.qty {
    width: 30px;
    text-align: center;
    font-size: 1.6rem;
}

.summary {
    margin-top: 40px;
    font-size: 2rem;
}

.row {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
}

.label {
    width: 170px;
    font-weight: bold;
}

.value {
    min-width: 120px;
}

input[type="number"] {
    width: 120px;
    font-size: 1.5rem;
    padding: 5px;
}

.action-btn {
    margin-left: 10px;
    padding: 8px 15px;
    font-size: 1.5rem;
    border: 2px solid #000;
    border-radius: 8px;
    background: #fff;
}

.reset-btn {
    margin-top: 20px;
    padding: 15px 30px;
    font-size: 2rem;
    border: 2px solid #000;
    border-radius: 12px;
    background: #fff;
}

@media (max-width: 480px) {

    .product-name,
    .price,
    .summary {
        font-size: 1.5rem;
    }

    .btn {
        width: 45px;
        height: 45px;
    }

    .qty {
        font-size: 1.4rem;
    }

    .label {
        width: 120px;
    }

    input[type="number"] {
        width: 100px;
    }
}
</style>
</head>

<body>

<h1>注文</h1>

<div id="products"></div>

<div class="summary">

    <div class="row">
        <div class="label">合計</div>
        <div class="value" id="total">0</div>
    </div>

    <div class="row">
        <div class="label">預かり金</div>
        <input type="number" id="payment" inputmode="numeric">
        <button class="action-btn" onclick="clearPayment()">クリア</button>
    </div>

    <div class="row">
        <div class="label">お釣り</div>
        <div class="value" id="change">0</div>
    </div>

    <button class="reset-btn" onclick="resetAll()">最初から</button>

</div>

<script>
const items = [
    { name: "焼きそば", price: 700, qty: 0 },
    { name: "チャーハン", price: 500, qty: 0 },
    { name: "カリーブルスト", price: 500, qty: 0 },
    { name: "ビール", price: 600, qty: 0 }
];

const productsDiv = document.getElementById("products");

function renderProducts() {

    productsDiv.innerHTML = "";

    items.forEach((item, index) => {

        productsDiv.innerHTML += `
        <div class="product">
            <div class="product-name">${item.name}</div>
            <div class="price">${item.price}</div>

            <div class="control">
                <button class="btn" onclick="changeQty(${index}, -1)">−</button>
                <div class="qty" id="qty-${index}">${item.qty}</div>
                <button class="btn" onclick="changeQty(${index}, 1)">＋</button>
            </div>
        </div>
        `;
    });
}

function changeQty(index, diff) {

    items[index].qty += diff;

    if (items[index].qty < 0) {
        items[index].qty = 0;
    }

    document.getElementById(`qty-${index}`).textContent = items[index].qty;

    calculate();
}

function calculate() {

    let total = 0;

    items.forEach(item => {
        total += item.price * item.qty;
    });

    document.getElementById("total").textContent = total;

    const payment =
        Number(document.getElementById("payment").value) || 0;

    document.getElementById("change").textContent =
        payment - total;
}

document
    .getElementById("payment")
    .addEventListener("input", calculate);

function clearPayment() {

    document.getElementById("payment").value = "";
    calculate();
}

function resetAll() {

    items.forEach(item => item.qty = 0);

    renderProducts();

    document.getElementById("payment").value = "";

    calculate();
}

renderProducts();
calculate();
</script>

</body>
</html>
