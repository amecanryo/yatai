<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>２０２６あゆ祭り</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#d8e1ea;
}

.container{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.top-area{
    padding:15px;
    flex:1;
}

.reset-btn{
    width:110px;
    height:50px;
    font-size:20px;
    border:1px solid #333;
    border-radius:8px;
    background:#ddd;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#d8e1ea;
}

td{
    border:1px solid #333;
    height:58px;
    font-size:18px;
    text-align:center;
}

.item-name{
    text-align:left;
    padding-left:8px;
}

.price{
    width:70px;
}

.qty-cell{
    width:140px;
}

.qty-control{
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.qty-btn{
    width:36px;
    height:36px;
    font-size:24px;
    border:1px solid #333;
    border-radius:6px;
    background:#ddd;
}

.qty{
    font-size:20px;
    min-width:25px;
}

.bottom{
    background:#f3f3f3;
    padding:14px 10px;
}

.summary{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
}

.group{
    text-align:center;
}

.label{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.money-input{
    width:90px;
    height:34px;
    text-align:center;
    font-size:24px;
}

.clear-btn{
    width:90px;
    height:38px;
    font-size:18px;
    border-radius:6px;
    background:#ddd;
}

.value{
    font-size:22px;
}

@media (max-width:480px){
    td{
        font-size:16px;
    }

    .qty-btn{
        width:34px;
        height:34px;
    }

    .value{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top-area">

        <button class="reset-btn" onclick="resetAll()">最初から</button>

        <table id="menuTable">
            <tr>
                <td class="item-name">焼きそば</td>
                <td class="price">700</td>
                <td class="qty-cell">
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(0,-1)">-</button>
                        <span class="qty" id="qty0">0</span>
                        <button class="qty-btn" onclick="changeQty(0,1)">+</button>
                    </div>
                </td>
            </tr>

            <tr>
                <td class="item-name">チャーハン</td>
                <td class="price">500</td>
                <td class="qty-cell">
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(1,-1)">-</button>
                        <span class="qty" id="qty1">0</span>
                        <button class="qty-btn" onclick="changeQty(1,1)">+</button>
                    </div>
                </td>
            </tr>

            <tr>
                <td class="item-name">カリーブルスト</td>
                <td class="price">500</td>
                <td class="qty-cell">
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(2,-1)">-</button>
                        <span class="qty" id="qty2">0</span>
                        <button class="qty-btn" onclick="changeQty(2,1)">+</button>
                    </div>
                </td>
            </tr>

            <tr>
                <td class="item-name">冷やしキュウリ</td>
                <td class="price">500</td>
                <td class="qty-cell">
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(3,-1)">-</button>
                        <span class="qty" id="qty3">0</span>
                        <button class="qty-btn" onclick="changeQty(3,1)">+</button>
                    </div>
                </td>
            </tr>

            <tr>
                <td class="item-name">ラムネ</td>
                <td class="price">250</td>
                <td class="qty-cell">
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(4,-1)">-</button>
                        <span class="qty" id="qty4">0</span>
                        <button class="qty-btn" onclick="changeQty(4,1)">+</button>
                    </div>
                </td>
            </tr>

            <tr>
                <td class="item-name">ビール</td>
                <td class="price">600</td>
                <td class="qty-cell">
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(5,-1)">-</button>
                        <span class="qty" id="qty5">0</span>
                        <button class="qty-btn" onclick="changeQty(5,1)">+</button>
                    </div>
                </td>
            </tr>
        </table>

    </div>

    <div class="bottom">
        <div class="summary">

            <div class="group">
                <div class="label">預かり金</div>
                <input
                    type="number"
                    id="received"
                    class="money-input"
                    oninput="updateChange()">
            </div>

            <div class="group">
                <div class="label">&nbsp;</div>
                <button class="clear-btn" onclick="clearMoney()">
                    クリア
                </button>
            </div>

            <div class="group">
                <div class="label">合計</div>
                <div class="value" id="total">0</div>
            </div>

            <div class="group">
                <div class="label">お釣り</div>
                <div class="value" id="change">0</div>
            </div>

        </div>
    </div>

</div>

<script>

const prices = [700,500,500,500,250,600];
const qtys = [0,0,0,0,0,0];

function changeQty(index, diff){

    qtys[index] += diff;

    if(qtys[index] < 0){
        qtys[index] = 0;
    }

    document.getElementById("qty" + index).textContent = qtys[index];

    updateTotal();
}

function updateTotal(){

    let total = 0;

    for(let i=0;i<prices.length;i++){
        total += prices[i] * qtys[i];
    }

    document.getElementById("total").textContent = total;

    updateChange();
}

function updateChange(){

    const total =
        Number(document.getElementById("total").textContent);

    const received =
        Number(document.getElementById("received").value || 0);

    document.getElementById("change").textContent =
        received - total;
}

function clearMoney(){

    document.getElementById("received").value = "";
    updateChange();
}

function resetAll(){

    for(let i=0;i<qtys.length;i++){
        qtys[i] = 0;
        document.getElementById("qty" + i).textContent = 0;
    }

    document.getElementById("total").textContent = 0;
    document.getElementById("received").value = "";
    document.getElementById("change").textContent = 0;
}

</script>

</body>
</html>
