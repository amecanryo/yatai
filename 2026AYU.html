<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>２０２６年あゆ祭</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background-color: #dbeaf5;
    color: #333;
  }
  .header-bar {
    display: flex;
    justify-content: flex-end;
    padding: 12px 16px;
  }
  .reset-all-btn {
    background-color: #f2f2f2;
    border: 1px solid #999;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 15px;
    color: #333;
    cursor: pointer;
  }
  .reset-all-btn:active {
    background-color: #ddd;
  }
  .table-wrap {
    padding: 0 12px;
    padding-bottom: 160px; /* フッター分の余白 */
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
  }
  td {
    border-bottom: 1px solid #ddd;
    padding: 14px 8px;
    font-size: 17px;
    vertical-align: middle;
  }
  tr:first-child td {
    border-top: 1px solid #ddd;
  }
  .item-name {
    width: 42%;
    white-space: nowrap;
  }
  .item-price {
    width: 18%;
    color: #2f6fd1;
    text-align: right;
    padding-right: 10px;
    white-space: nowrap;
  }
  .item-control {
    width: 40%;
    text-align: center;
  }
  .qty-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .qty-btn {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    border: 1px solid #999;
    background-color: #f2f2f2;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .qty-btn:active {
    background-color: #ddd;
  }
  .qty-value {
    width: 34px;
    text-align: center;
    font-size: 17px;
  }

  /* フッター */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: #dbeaf5;
    border-top: 2px solid #b7cee0;
    padding: 12px 16px 16px;
    z-index: 100;
  }
  .footer-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  .footer-col {
    flex: 1;
    text-align: center;
  }
  .footer-label {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .deposit-input {
    width: 100%;
    max-width: 130px;
    font-size: 18px;
    text-align: center;
    padding: 8px 4px;
    border: 1px solid #999;
    border-radius: 6px;
  }
  .clear-btn {
    margin-top: 8px;
    background-color: #f2f2f2;
    border: 1px solid #999;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 14px;
    color: #333;
    cursor: pointer;
  }
  .clear-btn:active {
    background-color: #ddd;
  }
  .footer-value {
    font-size: 22px;
    font-weight: bold;
    padding-top: 6px;
  }
</style>
</head>
<body>

<div class="header-bar">
  <button class="reset-all-btn" onclick="resetAll()">最初から</button>
</div>

<div class="table-wrap">
  <table id="itemTable">
    <!-- JSで生成 -->
  </table>
</div>

<div class="footer">
  <div class="footer-row">
    <div class="footer-col">
      <div class="footer-label">預かり金</div>
      <input type="number" id="depositInput" class="deposit-input" placeholder="" oninput="updateFooter()">
      <br>
      <button class="clear-btn" onclick="clearDeposit()">クリア</button>
    </div>
    <div class="footer-col">
      <div class="footer-label">合計</div>
      <div class="footer-value" id="totalValue">0</div>
    </div>
    <div class="footer-col">
      <div class="footer-label">お釣り</div>
      <div class="footer-value" id="changeValue">0</div>
    </div>
  </div>
</div>

<script>
  // 商品データ（名前, 単価）
  const items = [
    { name: "焼きそば", price: 700 },
    { name: "チャーハン", price: 500 },
    { name: "カリーブルスト", price: 500 },
    { name: "冷やしキュウリ", price: 500 },
    { name: "ラムネ", price: 250 },
    { name: "ビール", price: 600 },
    { name: "水", price: 100 },
    { name: "チューハイ", price: 200 },
    { name: "ハイボール", price: 300 },
    { name: "ポテト", price: 400 },
    { name: "唐揚げ", price: 500 },
    { name: "たこ焼き", price: 600 }
  ];

  // 各商品の個数を保持
  const quantities = new Array(items.length).fill(0);

  function renderTable() {
    const table = document.getElementById('itemTable');
    table.innerHTML = '';
    items.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="item-name">${item.name}</td>
        <td class="item-price">${item.price}</td>
        <td class="item-control">
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
            <div class="qty-value" id="qty-${index}">${quantities[index]}</div>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </div>
        </td>
      `;
      table.appendChild(tr);
    });
  }

  function changeQty(index, delta) {
    const newQty = quantities[index] + delta;
    if (newQty < 0) return; // 0未満にはしない
    quantities[index] = newQty;
    document.getElementById('qty-' + index).textContent = newQty;
    updateFooter();
  }

  function calcTotal() {
    let total = 0;
    items.forEach((item, index) => {
      total += item.price * quantities[index];
    });
    return total;
  }

  function updateFooter() {
    const total = calcTotal();
    document.getElementById('totalValue').textContent = total;

    const depositInput = document.getElementById('depositInput');
    const depositRaw = depositInput.value;
    let change = 0;
    if (depositRaw !== '') {
      const deposit = Number(depositRaw);
      change = deposit - total;
    }
    document.getElementById('changeValue').textContent = change;
  }

  function clearDeposit() {
    document.getElementById('depositInput').value = '';
    updateFooter();
  }

  function resetAll() {
    for (let i = 0; i < quantities.length; i++) {
      quantities[i] = 0;
    }
    renderTable();
    updateFooter();
  }

  // 初期描画
  renderTable();
  updateFooter();
</script>

</body>
</html>
